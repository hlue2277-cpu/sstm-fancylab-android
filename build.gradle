// Top-level build file where you can add configuration options common to all sub-projects/modules.
apply from: "config.gradle"
buildscript {
    ext {
        kotlin_version = '1.4.21'
    }
    repositories {
        maven { url "https://jitpack.io" }
//        maven { url 'https://dl.bintray.com/umsdk/release' }
        maven { url 'https://repo1.maven.org/maven2/' }
        maven { url 'https://maven.aliyun.com/repository/jcenter' } //jcenter()
        maven { url 'https://maven.aliyun.com/repository/google' }  //google()
        google()
        jcenter()
//        google()
//        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:4.2.0"
        classpath 'com.novoda:bintray-release:0.9.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.github.dcendents:android-maven-gradle-plugin:2.1'
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.7.10'
    }
}

allprojects {
    repositories {
        maven { url "https://jitpack.io" }
//        maven { url 'https://dl.bintray.com/umsdk/release' }
        maven { url 'https://repo1.maven.org/maven2/' }
//
//        mavenCentral()
////        jcenter() // Warning: this repository is going to shut down soon
        maven { url 'https://maven.aliyun.com/repository/jcenter' } //jcenter()
        maven { url 'https://maven.aliyun.com/repository/google' }  //google()
        //maven {
        //    // allowInsecureProtocol = true // gradle7需要放开这个注释
        //    url 'http://bj.speedata.cn:8081/repository/spd-maven-public'
        //}
        maven {
            //allowInsecureProtocol = true // gradle7需要放开这个注释
            //url 'http://bj.speedata.cn:8081/repository/spd-maven-public'
            url 'https://bj.speedata.cn:8443/repository/maven-releases/'
        }
        google()
        jcenter()
        flatDir {
            dirs 'libs'
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}